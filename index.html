<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mem0 Lite Mobile</title><style>body{font:16px system-ui;background:#101820;color:#eee;padding:16px}input,button{font:inherit;padding:10px;margin:4px;border-radius:9px}button{background:#69dca2;border:0}pre{background:#23303b;padding:12px;white-space:pre-wrap}</style><h1>Mem0 Lite</h1><label><input type="checkbox" id="consent"> I consent to storing memories locally</label><p><input id="category" value="general" placeholder="category"><input id="memory" placeholder="memory text"></p><button onclick="save()">Save</button><input id="q" placeholder="search"><button onclick="searchMem()">Search</button><button onclick="clearMem()">Clear DB</button><pre id="out">Local browser storage test ready</pre><script>function db(){return JSON.parse(localStorage.mem0lite_db||'[]')}function save(){if(!consent.checked){out.textContent='Consent required.';return}let d=db();d.push({text:memory.value,category:category.value,language:'en'});localStorage.mem0lite_db=JSON.stringify(d);out.textContent='Stored on this browser/device.'}function searchMem(){let qx=q.value.toLowerCase();out.textContent=JSON.stringify(db().filter(r=>(r.text+' '+r.category).toLowerCase().includes(qx)),null,2)}function clearMem(){localStorage.mem0lite_db='[]';out.textContent='Cleared local test database.'}</script></html>
